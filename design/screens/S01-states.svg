ight="400" fill="#566E83" text-anchor="start"><tspan x="164" dy="0">구현용 상태별 문구 · 모두 주차 중에만 표시</tspan></text><rect x="164" y="250" width="600" height="178" rx="28" fill="#FFFFFF" opacity="0.96" stroke="#D6E0E8" stroke-width="1" filter="url(#soft)"/><text x="192" y="295" font-family="Noto Sans KR, sans-serif" font-size="25" font-weight="700" fill="#002C5F" text-anchor="start"><tspan x="192" dy="0">점수 동점</tspan></text><text x="192" y="335" font-family="Noto Sans KR, sans-serif" font-size="20" font-weight="400" fill="#19364D" text-anchor="start"><tspan x="192" dy="0">물가 14 · 산자락 14 · 도시 0</tspan></text><text x="192" y="371" font-family="Noto Sans KR, sans-serif" font-size="20" font-weight="400" fill="#377EAC" text-anchor="start"><tspan x="192" dy="0">예상: 물가의 달빛종</tspan></text><text x="192" y="404" font-family="Noto Sans KR, sans-serif" font-size="16" font-weight="400" fill="#566E83" text-anchor="start"><tspan x="192" dy="0">같은 점수면 물가 → 산자락 → 도시 순서</tspan></text><rect x="792" y="250" width="600" height="178" rx="28" fill="#FFFFFF" opacity="0.96" stroke="#D6E0E8" stroke-width="1" filter="url(#soft)"/><text x="820" y="295" font-family="Noto Sans KR, sans-serif" font-size="25" font-weight="700" fill="#002C5F" text-anchor="start"><tspan x="820" dy="0">아직 지역 점수 없음</tspan></text><text x="820" y="335" font-family="Noto Sans KR, sans-serif" font-size="20" font-weight="400" fill="#19364D" text-anchor="start"><tspan x="820" dy="0">물가 0 · 산자락 0 · 도시 0</tspan></text><text x="820" y="371" font-family="Noto Sans KR, sans-serif" font-size="20" font-weight="400" fill="#377EAC" text-anchor="start"><tspan x="820" dy="0">예상: 달빛종</tspan></text><text x="820" y="404" font-family="Noto Sans KR, sans-serif" font-size="16" font-weight="400" fill="#566E83" text-anchor="start"><tspan x="820" dy="0">0점이면 이름 앞말을 붙이지 않아요.</tspan></text><rect x="164" y="450" width="600" height="178" rx="28" fill="#FFFFFF" opacity="0.96" stroke="#D6E0E8" stroke-width="1" filter="url(#soft)"/><text x="192" y="495" font-