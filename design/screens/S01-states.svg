anchor="start"><tspan x="192" dy="0">거리 경험치는 정상 반영됐어요.</tspan></text><text x="192" y="771" font-family="Noto Sans KR, sans-serif" font-size="20" font-weight="400" fill="#377EAC" text-anchor="start"><tspan x="192" dy="0">지역 점수와 지역 보상은 없어요.</tspan></text><text x="192" y="804" font-family="Noto Sans KR, sans-serif" font-size="16" font-weight="400" fill="#566E83" text-anchor="start"><tspan x="192" dy="0">정확한 위치나 획득 지역을 추측하지 않아요.</tspan></text><rect x="792" y="650" width="600" height="178" rx="28" fill="#FFFFFF" opacity="0.96" stroke="#D6E0E8" stroke-width="1" filter="url(#soft)"/><text x="820" y="695" font-family="Noto Sans KR, sans-serif" font-size="25" font-weight="700" fill="#002C5F" text-anchor="start"><tspan x="820" dy="0">주행 제한 · 신호 미확인</tspan></text><text x="820" y="735" font-family="Noto Sans KR, sans-serif" font-size="20" font-weight="400" fill="#19364D" text-anchor="start"><tspan x="820" dy="0">게임 표시와 입력을 중단해요.</tspan></text><text x="820" y="771" font-family="Noto Sans KR, sans-serif" font-size="20" font-weight="400" fill="#377EAC" text-anchor="start"><tspan x="820" dy="0">작성 중 선택은 보관 · 사용은 하지 않음</tspan></text><text x="820" y="804" font-family="Noto Sans KR, sans-serif" font-size="16" font-weight="400" fill="#566E83" text-anchor="start"><tspan x="820" dy="0">주차 복귀 후 재고와 단계부터 다시 확인</tspan></text></svg>